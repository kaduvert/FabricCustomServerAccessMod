plugins {
    // Declare both plugin IDs but do not apply them yet
    id 'net.fabricmc.fabric-loom' version '1.15.2' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.15.2' apply false
    id 'maven-publish'
}

def javaVersion = project.hasProperty('java_version') ? project.java_version.toInteger() : 21

// Detect 26.1+ builds: version strings use a year-based scheme (e.g. "26.1.2")
def is261Plus = project.hasProperty('minecraft_version') && !project.minecraft_version.startsWith('1.')

// Conditionally apply the correct Loom plugin based on the Minecraft version
if (is261Plus) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

loom {
    enableModProvidedJavadoc = false
}

base {
    archivesName = project.archives_base_name
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

repositories {
    // Loom adds the essential Minecraft / Fabric Maven repositories automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (!is261Plus) {
        // ── Legacy builds (Minecraft 1.x, Yarn-mapped) ─────────────────────────────
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        // ── Modern builds (Minecraft 26.1+, unobfuscated) ──────────────────────────
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(project.properties)
    }

    // Inject the correct Mixin compatibility level so that:
    //   - Legacy builds (Java 21) produce JAVA_21 → mixin applies to 1.x class files
    //   - Modern builds (Java 25) produce JAVA_25 → mixin applies to 26.1+ class files
    // If the level is too low for the target class, SpongePowered Mixin silently
    // skips the injection at runtime, which would break the mod.
    filesMatching("csam.mixins.json") {
        expand(['mixin_java_level': "JAVA_${javaVersion}"])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add publishing targets here if needed.
    }
}
